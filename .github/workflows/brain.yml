name: BRAIN daily

on:
  schedule:
    - cron: "30 12 * * *"   # 6:00 pm IST every day (after the 10:13 am Mac run)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Simulate and submit
        env:
          BRAIN_EMAIL: ${{ secrets.BRAIN_EMAIL }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
        run: python brain_daily.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results_*.csv
